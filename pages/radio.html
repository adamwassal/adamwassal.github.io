<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/fonts/fontawesome-free-6.6.0-web/css/all.min.css">
      <script src="../libs/jquery-1.10.2.min.js" type="text/javascript"></script>

   <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">

    <style></style>

</head>

<body>
    <div class="page-bg theme-radio">
        <div class="bg-grid"></div>
        <div class="bg-blob blob-a"></div>
        <div class="bg-blob blob-b"></div>
        <div class="bg-blob blob-c"></div>
    </div>

    <div id="header-container" class="header" data-page-title="الراديو"></div>

    <main class="main radio-page">
        <section class="section radio-hero">
            <div class="radio-hero-inner">
                <h1>راديو القرآن الكريم</h1>
                <p>واجهة أبسط، وصول أسرع لمحطاتك المفضلة، وتحكم أدق في التشغيل.</p>
            </div>
        </section>

        <section class="section">
            <div class="radio-layout">
                <article class="radio-player">
                    <div class="radio-player-head">
                        <span class="live-pill"><i class="fa-solid fa-wave-square"></i> بث مباشر</span>
                        <button class="player-btn icon-only favorite-toggle" aria-label="إضافة للمفضلة">
                            <i class="fa-regular fa-star"></i>
                        </button>
                    </div>

                    <img src="" alt="" class="radio-image loading">
                    <h2 class="radio-name loading">جاري التحميل...</h2>
                    <p class="now-playing">جاري تحميل بيانات المحطات...</p>

                    <div class="audio-player custom-player">
                        <audio class="quranPlayer" preload="none"></audio>
                        <div class="player-controls">
                            <button class="player-btn prev-toggle" aria-label="المحطة السابقة">
                                <i class="fa-solid fa-backward-step"></i>
                            </button>
                            <button class="player-btn play-toggle primary" aria-label="تشغيل أو إيقاف">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <button class="player-btn next-toggle" aria-label="المحطة التالية">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                        </div>

                        <div class="player-status-row">
                            <div class="player-status">
                                <span class="player-state">متوقف</span>
                                <span class="player-meta">اضغط تشغيل للبدء</span>
                            </div>
                            <div class="volume-wrap">
                                <button class="player-btn mute-toggle icon-only" aria-label="كتم الصوت">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                                <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1"
                                    aria-label="مستوى الصوت">
                                <span class="volume-value">100%</span>
                            </div>
                        </div>
                    </div>
                </article>

                <aside class="stations-panel">
                    <div class="stations-header">
                        <div>
                            <h2>قائمة المحطات</h2>
                            <span class="stations-subtitle">ابحث أو صفِّ حسب تفضيلاتك</span>
                        </div>
                        <button class="player-btn icon-only refresh-stations" aria-label="تحديث المحطات">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>

                    <div class="stations-tools">
                        <div class="stations-search">
                            <i class="fa fa-search"></i>
                            <input type="search" id="stationSearch" placeholder="ابحث عن محطة...">
                        </div>
                        <div class="stations-filters">
                            <button class="station-filter active" data-filter="all">الكل</button>
                            <button class="station-filter" data-filter="favorites">المفضلة</button>
                            <button class="station-filter" data-filter="recent">آخر تشغيل</button>
                        </div>
                    </div>

                    <div class="stations-summary">
                        <span id="stationsCount">0 محطة</span>
                        <span id="stationsHint">اختر محطة للبدء</span>
                    </div>

                    <div class="stations-container"></div>
                </aside>
            </div>
        </section>
    </main>



        <script src="../components/header.js"></script>
        <script src="../assets/js/notify.js"></script>
        <script src="../libs/notify.min.js"></script>
        <script src="../assets/js/toast_notification.js"></script>
        <script src="../assets/js/global.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Hide the loading spinner after the page is fully loaded

                window.addEventListener("load", () => {
                    const loadingContainer = document.querySelector(".loading_container");
                    if (loadingContainer) {
                        loadingContainer.classList.add("fade-out");
                        setTimeout(() => {
                            loadingContainer.style.display = "none";
                        }, 2000);
                    }
                });


                const today = new Date();
                const day = String(today.getDate()).padStart(2, "0");
                const month = String(today.getMonth() + 1).padStart(2, "0");
                const year = today.getFullYear();
                const hijriDate = `${day}-${month}-${year}`;

                fetch(`https://api.aladhan.com/v1/gToH/${hijriDate}`)
                    .then((response) => response.json())
                    .then((data) => {
                        const hijri = data.data.hijri;
                        const display = ` ${hijri.weekday.ar} ${hijri.day} ${hijri.month.ar} ${hijri.year}`;
                        const hijiryDiv = document.getElementById("hijiry");
                        if (hijiryDiv) hijiryDiv.innerHTML = display;
                        if (hijri.weekday.ar === "الجمعة" && localStorage.getItem("notificationsEnabled") == "true") {

                            toastNotification(
                                `لا تنسى قراءة سورة الكهف اليوم`,
                                "alkahf",
                                "surah.html?number=18",
                                "سورة الكهف"
                            );
                        }
                    })
                    .catch((error) => {
                        console.error("Fetch Error:", error);

                    });
            });


        </script>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const STORAGE_KEY = "radioPageStateV2";
                const API_URL = "https://data-rosy.vercel.app/radio.json";
                const state = {
                    stations: [],
                    currentId: null,
                    search: "",
                    filter: "all",
                    favorites: [],
                    recent: [],
                    volume: 1,
                    muted: false,
                };

                const els = {
                    audio: document.querySelector(".quranPlayer"),
                    image: document.querySelector(".radio-image"),
                    name: document.querySelector(".radio-name"),
                    nowPlaying: document.querySelector(".now-playing"),
                    playToggle: document.querySelector(".play-toggle"),
                    prevToggle: document.querySelector(".prev-toggle"),
                    nextToggle: document.querySelector(".next-toggle"),
                    muteToggle: document.querySelector(".mute-toggle"),
                    volumeSlider: document.querySelector(".volume-slider"),
                    volumeValue: document.querySelector(".volume-value"),
                    playerState: document.querySelector(".player-state"),
                    playerMeta: document.querySelector(".player-meta"),
                    favoriteToggle: document.querySelector(".favorite-toggle"),
                    stationsContainer: document.querySelector(".stations-container"),
                    stationSearch: document.getElementById("stationSearch"),
                    filters: [...document.querySelectorAll(".station-filter")],
                    stationsCount: document.getElementById("stationsCount"),
                    stationsHint: document.getElementById("stationsHint"),
                    refreshStations: document.querySelector(".refresh-stations"),
                };

                function persistState() {
                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify({
                            currentId: state.currentId,
                            favorites: state.favorites,
                            recent: state.recent.slice(0, 15),
                            volume: state.volume,
                            muted: state.muted,
                            filter: state.filter,
                            search: state.search,
                        }),
                    );
                }

                function restoreState() {
                    try {
                        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                        state.currentId = saved.currentId != null ? String(saved.currentId) : null;
                        state.favorites = Array.isArray(saved.favorites) ? saved.favorites.map((id) => String(id)) : [];
                        state.recent = Array.isArray(saved.recent) ? saved.recent.map((id) => String(id)) : [];
                        state.volume = typeof saved.volume === "number" ? Math.max(0, Math.min(1, saved.volume)) : 1;
                        state.muted = Boolean(saved.muted);
                        state.filter = typeof saved.filter === "string" ? saved.filter : "all";
                        state.search = typeof saved.search === "string" ? saved.search : "";
                    } catch (error) {
                        // no-op
                    }
                }

                function setPlayerState(label, meta) {
                    els.playerState.textContent = label;
                    if (meta) els.playerMeta.textContent = meta;
                }

                function setPlayUi(isPlaying) {
                    els.playToggle.innerHTML = isPlaying
                        ? "<i class='fa-solid fa-pause'></i>"
                        : "<i class='fa-solid fa-play'></i>";
                }

                function updateVolumeUi() {
                    els.volumeSlider.value = String(state.volume);
                    els.volumeValue.textContent = `${Math.round(state.volume * 100)}%`;
                    els.muteToggle.innerHTML = state.muted || state.volume === 0
                        ? "<i class='fa-solid fa-volume-xmark'></i>"
                        : "<i class='fa-solid fa-volume-high'></i>";
                }

                function getVisibleStations() {
                    const q = state.search.trim().toLowerCase();
                    let list = [...state.stations];
                    if (state.filter === "favorites") {
                        list = list.filter((s) => state.favorites.includes(String(s.id)));
                    } else if (state.filter === "recent") {
                        list = state.recent
                            .map((id) => list.find((s) => String(s.id) === id))
                            .filter(Boolean);
                    }
                    if (q) {
                        list = list.filter((s) => s.name.toLowerCase().includes(q));
                    }
                    return list;
                }

                function renderStations() {
                    const visible = getVisibleStations();
                    els.filters.forEach((btn) => {
                        btn.classList.toggle("active", btn.dataset.filter === state.filter);
                    });

                    els.stationsCount.textContent = `${visible.length} محطة`;
                    els.stationsHint.textContent = state.currentId
                        ? "استخدم الأسهم للتنقل السريع"
                        : "اختر محطة للبدء";

                    if (!visible.length) {
                        els.stationsContainer.innerHTML = `<div class="stations-empty">لا توجد محطات مطابقة.</div>`;
                        return;
                    }

                    els.stationsContainer.innerHTML = visible
                        .map((station) => {
                            const isActive = String(station.id) === state.currentId;
                            const isFav = state.favorites.includes(String(station.id));
                            return `
                                <button class="station-item ${isActive ? "active" : ""}" data-id="${station.id}">
                                    <span class="station-main">
                                        <img src="${station.img}" alt="${station.name}" class="thumb">
                                        <span class="station-text">${station.name}</span>
                                    </span>
                                    <span class="station-actions">
                                        ${isActive ? "<i class='fa-solid fa-circle-play'></i>" : ""}
                                        ${isFav ? "<i class='fa-solid fa-star'></i>" : "<i class='fa-regular fa-star'></i>"}
                                    </span>
                                </button>
                            `;
                        })
                        .join("");
                }

                function getCurrentStation() {
                    return state.stations.find((s) => String(s.id) === state.currentId) || null;
                }

                function updateFavoriteUi() {
                    const current = getCurrentStation();
                    const isFav = current && state.favorites.includes(String(current.id));
                    els.favoriteToggle.innerHTML = isFav
                        ? "<i class='fa-solid fa-star'></i>"
                        : "<i class='fa-regular fa-star'></i>";
                }

                async function selectStation(stationId, autoplay = true) {
                    const wantedId = String(stationId);
                    const station = state.stations.find((s) => String(s.id) === wantedId);
                    if (!station) return;

                    state.currentId = String(station.id);
                    state.recent = [state.currentId, ...state.recent.filter((id) => id !== state.currentId)].slice(0, 15);
                    persistState();

                    els.image.classList.add("loading");
                    els.name.classList.add("loading");
                    els.name.textContent = station.name;
                    els.nowPlaying.textContent = `تم اختيار: ${station.name}`;
                    setPlayerState("جاري التحميل", "جودة عالية");

                    els.audio.pause();
                    els.audio.src = station.url;
                    els.audio.load();

                    els.image.src = station.img;
                    els.image.alt = station.name;
                    els.name.textContent = station.name;

                    if (autoplay) {
                        try {
                            await els.audio.play();
                        } catch (error) {
                            setPlayerState("متوقف", "اضغط تشغيل للبدء");
                        }
                    }

                    els.image.classList.remove("loading");
                    els.name.classList.remove("loading");
                    els.nowPlaying.textContent = autoplay
                        ? `جاري التشغيل: ${station.name}`
                        : `جاهز للتشغيل: ${station.name}`;
                    updateFavoriteUi();
                    renderStations();
                }

                function changeStation(step) {
                    const visible = getVisibleStations();
                    if (!visible.length) return;
                    const currentIndex = visible.findIndex((s) => String(s.id) === state.currentId);
                    const nextIndex = currentIndex < 0
                        ? 0
                        : (currentIndex + step + visible.length) % visible.length;
                    selectStation(String(visible[nextIndex].id), true);
                }

                function toggleFavorite() {
                    const current = getCurrentStation();
                    if (!current) return;
                    const currentId = String(current.id);
                    const exists = state.favorites.includes(currentId);
                    if (exists) {
                        state.favorites = state.favorites.filter((id) => id !== currentId);
                    } else {
                        state.favorites = [currentId, ...state.favorites];
                    }
                    persistState();
                    updateFavoriteUi();
                    renderStations();
                }

                async function fetchStations() {
                    els.stationsContainer.innerHTML = `<div class="stations-empty">جاري تحميل المحطات...</div>`;
                    try {
                        const response = await fetch(API_URL);
                        if (!response.ok) throw new Error("Failed stations fetch");
                        const data = await response.json();
                        state.stations = Array.isArray(data.radios) ? data.radios : [];
                        if (!state.stations.length) throw new Error("No stations");

                        if (!state.currentId || !state.stations.some((s) => String(s.id) === state.currentId)) {
                            state.currentId = String(state.stations[0].id);
                        }
                        renderStations();
                        await selectStation(state.currentId, false);
                    } catch (error) {
                        els.stationsContainer.innerHTML = `
                            <div class="stations-empty error">
                                تعذر تحميل المحطات الآن.
                                <button class="retry-load">إعادة المحاولة</button>
                            </div>
                        `;
                        els.stationsContainer.querySelector(".retry-load")?.addEventListener("click", fetchStations);
                        setPlayerState("غير متصل", "تحقق من الإنترنت ثم حاول مرة أخرى");
                        els.nowPlaying.textContent = "حدث خطأ أثناء تحميل البيانات";
                    }
                }

                function bindEvents() {
                    els.playToggle.addEventListener("click", async () => {
                        if (!els.audio.src && state.currentId) {
                            await selectStation(state.currentId, true);
                            return;
                        }
                        if (els.audio.paused) {
                            try {
                                await els.audio.play();
                            } catch (error) {
                                setPlayerState("متوقف", "تعذر التشغيل تلقائيًا");
                            }
                        } else {
                            els.audio.pause();
                        }
                    });

                    els.prevToggle.addEventListener("click", () => changeStation(-1));
                    els.nextToggle.addEventListener("click", () => changeStation(1));
                    els.favoriteToggle.addEventListener("click", toggleFavorite);
                    els.refreshStations.addEventListener("click", fetchStations);

                    els.muteToggle.addEventListener("click", () => {
                        state.muted = !state.muted;
                        els.audio.muted = state.muted;
                        updateVolumeUi();
                        persistState();
                    });

                    els.volumeSlider.addEventListener("input", (event) => {
                        state.volume = Number(event.target.value);
                        state.muted = state.volume === 0;
                        els.audio.volume = state.volume;
                        els.audio.muted = state.muted;
                        updateVolumeUi();
                        persistState();
                    });

                    els.stationSearch.addEventListener("input", (event) => {
                        state.search = event.target.value;
                        persistState();
                        renderStations();
                    });

                    els.filters.forEach((btn) => {
                        btn.addEventListener("click", () => {
                            state.filter = btn.dataset.filter;
                            persistState();
                            renderStations();
                        });
                    });

                    els.stationsContainer.addEventListener("click", (event) => {
                        const item = event.target.closest(".station-item");
                        if (!item) return;
                        const stationId = item.dataset.id;
                        if (!stationId) return;
                        selectStation(stationId, true);
                    });

                    els.audio.addEventListener("playing", () => {
                        setPlayUi(true);
                        setPlayerState("يعمل الآن", "جودة عالية");
                    });
                    els.audio.addEventListener("pause", () => {
                        setPlayUi(false);
                        setPlayerState("متوقف", "يمكنك المتابعة في أي وقت");
                    });
                    els.audio.addEventListener("waiting", () => {
                        setPlayerState("جاري التخزين المؤقت", "انتظر لحظات...");
                    });
                    els.audio.addEventListener("error", () => {
                        setPlayUi(false);
                        setPlayerState("تعذر التشغيل", "جرّب محطة أخرى");
                    });

                    document.addEventListener("keydown", (event) => {
                        const activeTag = document.activeElement?.tagName;
                        if (activeTag === "INPUT" || activeTag === "TEXTAREA") return;
                        if (event.code === "Space") {
                            event.preventDefault();
                            els.playToggle.click();
                        } else if (event.code === "ArrowRight") {
                            changeStation(1);
                        } else if (event.code === "ArrowLeft") {
                            changeStation(-1);
                        }
                    });
                }

                restoreState();
                els.audio.volume = state.volume;
                els.audio.muted = state.muted;
                els.stationSearch.value = state.search;
                updateVolumeUi();
                bindEvents();
                fetchStations();
            });
        </script>
</body>
</html>
