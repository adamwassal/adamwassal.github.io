<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راديو</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/fonts/fontawesome-free-6.6.0-web/css/all.min.css">
      <script src="../libs/jquery-1.10.2.min.js" type="text/javascript"></script>

   <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">

    <style></style>

</head>

<body>
    <div class="page-bg theme-radio">
        <div class="bg-grid"></div>
        <div class="bg-blob blob-a"></div>
        <div class="bg-blob blob-b"></div>
        <div class="bg-blob blob-c"></div>
    </div>

    <div id="header-container" class="header" data-page-title="الراديو"></div>

    <div class="main radio-page">
        <div class="section radio-hero">
            <div class="radio-hero-inner">
                <h1>راديو القرآن الكريم</h1>
                <p>استمع الآن إلى أشهر القرّاء والإذاعات بجودة عالية.</p>
            </div>
        </div>

        <div class="section">
            <div class="radio-container radio-layout">
                <div class="radio-player">
                    <img src="" alt="" class="radio-image loading">
                    <div class="radio-name loading"></div>
                    <div class="audio-player custom-player">
                        <audio class="quranPlayer" autoplay></audio>
                        <div class="player-controls">
                            <button class="player-btn play-toggle" aria-label="تشغيل أو إيقاف">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <div class="player-status">
                                <span class="player-state">متوقف</span>
                                <span class="player-meta">جودة عالية</span>
                            </div>
                            <button class="player-btn mute-toggle" aria-label="كتم الصوت">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1"
                                aria-label="مستوى الصوت">
                        </div>
                    </div>
                    <div class="now-playing">جاري التشغيل...</div>
                </div>
                <div class="stations-panel">
                    <div class="stations-header">
                        <h2>قائمة المحطات</h2>
                        <span class="stations-subtitle">اختر إذاعتك المفضلة</span>
                    </div>
                    <div class="stations-container"></div>
                </div>
            </div>
        </div>
    </div>



        <script src="../components/header.js"></script>
        <script src="../assets/js/notify.js"></script>
        <script src="../libs/notify.min.js"></script>
        <script src="../assets/js/toast_notification.js"></script>
        <script src="../assets/js/global.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Hide the loading spinner after the page is fully loaded

                window.addEventListener("load", () => {
                    const loadingContainer = document.querySelector(".loading_container");
                    if (loadingContainer) {
                        loadingContainer.classList.add("fade-out");
                        setTimeout(() => {
                            loadingContainer.style.display = "none";
                        }, 2000);
                    }
                });


                const today = new Date();
                const day = String(today.getDate()).padStart(2, "0");
                const month = String(today.getMonth() + 1).padStart(2, "0");
                const year = today.getFullYear();
                const hijriDate = `${day}-${month}-${year}`;

                fetch(`https://api.aladhan.com/v1/gToH/${hijriDate}`)
                    .then((response) => response.json())
                    .then((data) => {
                        const hijri = data.data.hijri;
                        const display = ` ${hijri.weekday.ar} ${hijri.day} ${hijri.month.ar} ${hijri.year}`;
                        const hijiryDiv = document.getElementById("hijiry");
                        if (hijiryDiv) hijiryDiv.innerHTML = display;
                        console.log(hijri.day);
                        if (hijri.weekday.ar === "الجمعة" && localStorage.getItem("notificationsEnabled") == "true") {

                            toastNotification(
                                `لا تنسى قراءة سورة الكهف اليوم`,
                                "alkahf",
                                "surah.html?number=18",
                                "سورة الكهف"
                            );
                        }
                    })
                    .catch((error) => {
                        console.error("Fetch Error:", error);

                    });
            });


        </script>

        <script>
            // fetch data from https://data-rosy.vercel.app/radio.json

            async function renderallradios() {
                try {
                    const response = await fetch(`https://data-rosy.vercel.app/radio.json`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();

                    const radioContainer = document.querySelector(".stations-container"); // Updated selector

                    radioContainer.innerHTML = "";
                    data.radios.forEach((radio, index) => {
                        const radioDiv = document.createElement("div");
                        radioDiv.classList.add("station-item");

                        if (index == 0) {
                            radioDiv.innerHTML = `
                            <input type="radio" name="radio" id="${index}" onclick="radio(${radio.id})" checked/>
                            <label for="${index}">${radio.name} <img src="${radio.img}" class="thumb"/></label>
                        `;
                        } else {
                            radioDiv.innerHTML = `
                            <input type="radio" name="radio" id="${index}" onclick="radio(${radio.id})"/>
                            <label for="${index}">${radio.name} <img src="${radio.img}" class="thumb"/></label>
                        `;
                        }

                        radioContainer.appendChild(radioDiv);
                    });

                } catch (error) {
                    console.error("خطأ أثناء تحميل الراديو:", error);
                }
            }

            async function radio(id) {
                const radio_image = document.querySelector(".radio-image");
                const radio_name = document.querySelector(".radio-name");
                const radio_audio = document.querySelector(".quranPlayer");
                const nowPlaying = document.querySelector(".now-playing");
                const playToggle = document.querySelector(".play-toggle");
                const playerState = document.querySelector(".player-state");

                radio_image.classList.add("loading");
                radio_name.classList.add("loading");
                nowPlaying.textContent = "جاري التحميل...";

                await fetch(`https://data-rosy.vercel.app/radio.json`)
                    .then((response) => {
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        return response.json();
                    })
                    .then((data) => {
                        let reciter = data.radios[id - 1].name;
                        let url = data.radios[id - 1].url;
                        let image = data.radios[id - 1].img;

                        radio_image.src = image;
                        radio_image.alt = reciter;
                        radio_name.textContent = reciter;

                        radio_audio.pause();
                        radio_audio.src = url;
                        radio_audio.play();

                        nowPlaying.textContent = `جاري التشغيل: ${reciter}`;
                        playerState.textContent = "يعمل الآن";
                        playToggle.innerHTML = "<i class='fa-solid fa-pause'></i>";

                        radio_image.classList.remove("loading");
                        radio_name.classList.remove("loading");
                    })
                    .catch((error) => {
                        console.error("خطأ أثناء تحميل الراديو:", error);
                        radio_name.textContent = "تأكد من اتصالك بالانترنت";
                        nowPlaying.textContent = "حدث خطأ في التحميل";
                        radio_image.classList.remove("loading");
                        radio_name.classList.remove("loading");
                        playerState.textContent = "غير متصل";
                        playToggle.innerHTML = "<i class='fa-solid fa-play'></i>";
                    });
            }

            // Initialize
            renderallradios();
            radio(1);
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const audio = document.querySelector(".quranPlayer");
                const playToggle = document.querySelector(".play-toggle");
                const muteToggle = document.querySelector(".mute-toggle");
                const volumeSlider = document.querySelector(".volume-slider");
                const playerState = document.querySelector(".player-state");

                function setPlayUI(isPlaying) {
                    playToggle.innerHTML = isPlaying
                        ? "<i class='fa-solid fa-pause'></i>"
                        : "<i class='fa-solid fa-play'></i>";
                    playerState.textContent = isPlaying ? "يعمل الآن" : "متوقف";
                }

                playToggle.addEventListener("click", () => {
                    if (audio.paused) {
                        audio.play();
                        setPlayUI(true);
                    } else {
                        audio.pause();
                        setPlayUI(false);
                    }
                });

                muteToggle.addEventListener("click", () => {
                    audio.muted = !audio.muted;
                    muteToggle.innerHTML = audio.muted
                        ? "<i class='fa-solid fa-volume-xmark'></i>"
                        : "<i class='fa-solid fa-volume-high'></i>";
                });

                volumeSlider.addEventListener("input", (e) => {
                    audio.volume = parseFloat(e.target.value);
                    if (audio.volume === 0) {
                        audio.muted = true;
                        muteToggle.innerHTML = "<i class='fa-solid fa-volume-xmark'></i>";
                    } else {
                        audio.muted = false;
                        muteToggle.innerHTML = "<i class='fa-solid fa-volume-high'></i>";
                    }
                });

                audio.addEventListener("playing", () => setPlayUI(true));
                audio.addEventListener("pause", () => setPlayUI(false));
            });
        </script>
</html>
