<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء اصطناعي الخاص بـــ رياض الجنه</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/lateef.css" />
    <link rel="stylesheet" href="../assets/fonts/fontawesome-free-6.6.0-web/css/all.min.css" />
    <script src="../libs/jquery-1.10.2.min.js" type="text/javascript"></script>
    <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">

    <style></style>

    <link rel="stylesheet" href="../assets/css/hint.css-2.7.0/hint.css" />

</head>

<body>
    <div class="page-bg theme-ai">
        <div class="bg-grid"></div>
        <div class="bg-blob blob-a"></div>
        <div class="bg-blob blob-b"></div>
        <div class="bg-blob blob-c"></div>
    </div>
    <div id="header-container" class="header" data-page-title="ذكاء اصطناعي الخاص بـــ رياض الجنه"></div>

    <div class="ai-page">
        <div class="ai-hero">
            <div class="ai-hero-inner">
                <div class="ai-title">
                    <h1>مساعد رياض الجنة الذكي</h1>
                    <i class="fas fa-robot" style="font-size: 40px;"></i>
                </div>
                <p>اسأل عن التفسير والأحكام والمعاني، واحصل على إجابة منظمة بسرعة.</p>
            </div>
        </div>

        <div class="ai-container">
            <div class="ai-card ai-input-card">
                <div class="ai-input-header">
                    <h2>سؤالك</h2>
                    <span class="ai-meta">اكتب سؤالك بوضوح</span>
                </div>
                <div class="ai-input-row">
                    <textarea id="questioninput" placeholder="...اكتب سؤالك الديني هنا"></textarea>
                    <button onclick="askGeminiPage()" type="submit" class="ai-send">
                        <i class="fas fa-paper-plane"></i>
                        إرسال
                    </button>
                </div>
                <div class="ai-hints">
                    <span>مثال: ما معنى آية الكرسي؟</span>
                    <span>مثال: كيف أقرأ أذكار الصباح؟</span>
                </div>
            </div>
            <div class="ai-card">
                <div class="ai-card-header">
                    <div>
                        <h2>الإجابة</h2>
                        <span class="ai-meta">مساعد ذكي • إجابات مختصرة وواضحة</span>
                    </div>
                    <button class="hint--right ai-copy" onclick="copy()" id="copybtn" aria-label="نسخ الإجابه">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
                <div id="answerdiv" class="ai-answer">في إنتظار السؤال</div>
            </div>


        </div>
    </div>

    <script src="../components/header.js"></script>
    <script src="../assets/js/notify.js"></script>
    <script src="../libs/notify.min.js"></script>
    <script src="../assets/js/toast_notification.js"></script>
    <script src="../assets/js/global.js"></script>
    <script>

        const questionInput = document.getElementById("questioninput");

        const answerDiv = document.getElementById("answerdiv");
        const copyBtn = document.getElementById("copybtn");
        questionInput.addEventListener("keydown", function (event) {
            // Check if the key pressed is "Enter"
            if (event.key === "Enter") {
                // Cancel the default action, if needed
                event.preventDefault();
                // Execute your function or trigger a button click
                askGeminiPage()
            }
        });



        function correct() {
            copyBtn.innerHTML = `
           <i class="fa-solid fa-check"></i>

            `

        }
        async function copy() {
            const text = answerDiv.innerText || answerDiv.textContent;

            navigator.clipboard.writeText(text).then(() => {
                toastNotification(`تم النسخ ✅`, "alkahf");
                setTimeout(correct, 10);
                copyBtn.innerHTML = `
          <i
                    class="far fa-copy"></i>

            `
            }).catch(err => {
                console.error("فشل النسخ ❌", err);
            });

        }

        async function askGeminiPage() {
            const answerDiv = document.getElementById("answerdiv");
            const question = document.getElementById("questioninput").value.trim();
            const questionInput = document.getElementById("questioninput");
            if (!question) {
                answerDiv.innerText = "من فضلك اكتب سؤالًا.";
                return;
            }

            answerDiv.innerText = "⏳ جاري التفكير...";

            try {
                const res = await fetch("https://riyadaljannah.adamwassal2.workers.dev/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });

                if (!res.ok) {
                    throw new Error("HTTP Error: " + res.status);
                }

                const data = await res.json();
                questionInput.value = "";

                // استخراج الرد من الـ Worker الجديد
                const rawText = data["reply"] || "❌ لم يتم الحصول على رد.";

                answerDiv.innerHTML = formatResponse(rawText);
            } catch (err) {
                answerDiv.innerText = "❌ حدث خطأ في الاتصال";
                console.error(err);
            }
        }


    </script>



</body>

</html>
