<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>سورة</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/fonts/fontawesome-free-6.6.0-web/css/all.min.css" />
  <script src="../assets/fonts/fontawesome-free-6.6.0-web/js/all.min.js"></script>
  <script src="../assets/js/global.js"></script>
  <link rel="icon" href="../assets/images/logo.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.9.0/dist/tf.min.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      padding-bottom: 0;
    }

    .fontsized {
      border-radius: 10px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      height: fit-content;
      position: absolute; right: 0;
      top: 70px;
      
    }

    .fontsized h3 {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .fontsized h3 i {
      font-size: 1.2rem;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      flex-grow: 1;
      height: 8px;
      border-radius: 5px;
      background: linear-gradient(to right, #2ecc71, #3498db);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #3498db;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .size-value {
      background-color: #2c3e50;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      min-width: 50px;
      text-align: center;
      color: white;
    }

    .size-presets {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    .size-btn {
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .size-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    .size-btn.active {
      background-color: var(--color-primary);
      color: white;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .footer {
      display: none;
    }

    /* الـ Popup Overlay */
    .info-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(3px);
      animation: fadeIn 0.3s ease;
    }

    /* الـ Popup Box */
    .info {
      background: var(--surface, #fff);
      color: var(--text-body);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
      text-align: center;
      width: 90%;
      max-width: 400px;
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .info.show {
      transform: scale(1);
      opacity: 1;
    }

    .info h2 {
      margin: 10px 0;
      font-weight: 600;
    }

    .info .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2.4rem;
      cursor: pointer;
      color: #888;
      transition: 0.2s;
    }

    .info .close-btn:hover {
      color: var(--color-primary, #f6c201);
      transform: rotate(90deg);
    }

    .recite-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 23, 0.55);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .recite-overlay.hidden {
      display: none;
    }

    .recite-modal {
      width: min(520px, 92%);
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      direction: rtl;
      text-align: right;
    }

    .recite-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .recite-header h3 {
      color: var(--text-heading);
      font-size: 1.2rem;
    }

    .recite-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .recite-ayah {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      font-size: 1.3rem;
      line-height: 2.1;
      margin-bottom: 12px;
    }

    .recite-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .recite-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-weight: 600;
    }

    .recite-btn.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #1b1b1b;
    }

    .recite-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .recite-status {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .recite-result {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .search-box {
      margin: 10px 0 0;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      flex: 1;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }

    .search-wrap:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 12px 30px rgba(246, 194, 1, 0.25);
      transform: translateY(-1px);
    }

    .search-wrap i {
      color: var(--color-secondary);
      font-size: 1.1rem;
    }

    .search-box input {
      flex: 1;
      padding: 10px 6px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: transparent;
    }

    .search-box button {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    .highlight {
      background: yellow;
      padding: 0 3px;
    }

    .search-results {
      margin-top: 12px;
      background: var(--surface);
      border-radius: 16px;
      padding: 8px;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }

    .search-results div {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      cursor: pointer;
      border-radius: 12px;
      background: var(--bg);
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    .search-results div:hover {
      background: rgba(246, 194, 1, 0.12);
      border-color: rgba(246, 194, 1, 0.5);
      color: var(--text-heading);
      transform: translateY(-1px);
    }

    #ayahSearch:focus {
      box-shadow: 0 6px 18px rgba(184, 124, 12, 0.925);

    }

    #ayahSearch {
      text-align: end;
    }

    .surah-toolbar {
      width: min(1100px, 92%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 10px auto 0;
    }

    #surah-name {
      width: min(560px, 92%);
      margin-inline: auto;
      color: var(--text-heading);
      background: linear-gradient(135deg, rgba(246, 194, 1, 0.95), rgba(246, 194, 1, 0.75));
      border: 1px solid rgba(246, 194, 1, 0.8);
      border-radius: 22px;
      padding: 14px 54px 14px 54px;
      text-align: center;
      line-height: 1.5;
      position: relative;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.14);
      font-size: clamp(1.45rem, 3.2vw, 2.05rem);
      font-family: "AmiriQuran", "Hafs", serif;
    }

    #surah-name .surah-name-text {
      display: inline-block;
    }

    .surah-info-btn {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: var(--color-secondary);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .surah-info-btn:hover {
      filter: brightness(1.06);
    }

    .basmala {
      width: min(700px, 92%);
      margin-inline: auto;
      text-align: center;
      font-family: "AmiriQuran", "Hafs", serif;
      font-size: clamp(1.35rem, 3vw, 1.95rem);
    }

    .layout-toggle {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .layout-toggle button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-heading);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .layout-toggle button.active {
      background: var(--color-primary);
      color: #1b1b1b;
    }

    .layout-toggle button:hover {
      transform: translateY(-1px);
    }

    #surah-ayahs {
      width: min(1100px, 92%);
      margin: 10px auto 30px;
      display: block;
      direction: rtl;
      text-align: justify;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      font-family: "AmiriQuran", sans-serif;
      font-size: 1.7em;
      line-height: 2.4;
      color: var(--text-body);
    }

    #surah-ayahs.layout-moshaf {
      text-align: justify;
      white-space: normal;
    }

    #surah-ayahs.layout-moshaf .ayah-inline {
      display: inline;
      margin: 0;
    }

    #surah-ayahs.layout-list {
      text-align: right;
    }

    #surah-ayahs.layout-list .ayah-inline {
      display: block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 44px 60px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      font-size: 1.4em;
      line-height: 2.2;
    }

    #surah-ayahs.layout-list .ayah-inline .ayah-number {
      margin-right: 0;
    }

    .ayah-inline {
      position: relative;
      display: inline;
      padding: 2px 6px;
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    .ayah-inline:hover,
    .ayah-inline.highlight {
      background: rgba(246, 194, 1, 0.12);
    }

    .ayah-inline .ayah-number {
      display: inline-block;
      margin: 0 6px;
      color: var(--color-secondary);
      font-size: 0.9em;
    }

    .ayah-inline .controls-inline {
      position: absolute;
      top: -42px;
      right: 0;
      display: flex;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateY(6px);
      z-index: 5;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(6px);
    }

    #surah-ayahs.layout-list .ayah-inline .controls-inline {
      top: -46px;
      right: 10px;
    }



    .ayah-inline:hover .controls-inline,
    .ayah-inline.highlight .controls-inline {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .controls-inline .control-btn {
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.9rem;
      color: var(--text-heading);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .controls-inline .control-btn i {
      font-size: 0.95rem;
    }

    .controls-inline .control-btn:hover {
      transform: translateY(-1px);
      background: rgba(246, 194, 1, 0.2);
      border-color: rgba(246, 194, 1, 0.6);
      color: var(--text-heading);
    }

    .controls-inline .control-btn.play-active {
      background: var(--color-primary);
      color: #1b1b1b;
      border-color: rgba(246, 194, 1, 0.8);
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
        align-items: stretch;
      }

      #surah-ayahs {
        font-size: 1.3em;
        padding: 20px 16px;
        text-align: right;
      }

      .ayah-inline .controls-inline {
        position: static;
        margin: 8px 0;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div class="page-bg theme-surah">
    <div class="bg-grid"></div>
    <div class="bg-blob blob-a"></div>
    <div class="bg-blob blob-b"></div>
    <div class="bg-blob blob-c"></div>
  </div>
  <div id="header-container" class="header" data-page-title="جاري تحميل السورة"></div>

  <div class="main">

    <div class="section">

      <a href="" class="button" id="gomark" style="visibility: hidden">الذهاب للعلامة <i class="fa fa-bookmark"></i></a>
      <div class="title" id="surah-name"></div>
      <div class="title basmala"> بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <div class="surah-toolbar">
        <div class="search-box">
          <div class="search-wrap">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="ayahSearch" placeholder="...ابحث عن آية" oninput="searchAyah()">
          </div>
          <button id="clearSearch" onclick="clearSearch()" style="display:none;">مسح</button>
        </div>
        <div class="layout-toggle" role="group" aria-label="تغيير عرض الآيات">
          <button type="button" class="layout-btn" data-layout="list"><i class="fas fa-list"></i> قائمة</button>
          <button type="button" class="layout-btn active" data-layout="moshaf"><i class="fas fa-book-open"></i> مصحف</button>
        </div>
      </div>
      <div id="searchResults" class="search-results"></div>
      <div id="surah-ayahs"></div>
      <div class="fixedleft">

        <a href="" class="button" id="nextsurah">السورة التالية <i class="fa-solid fa-arrow-right"></i></a>
        <a href="" class="button" id="prevsurah">السورة السابقة <i class="fa-solid fa-arrow-left"></i></a>
      </div>

      <div class="fixedright">

        <a class="button" onclick="lunch()" id="scroll-btn"><i class="fa-solid fa-arrow-down"></i> السحب التلقائي</a>

      </div>


    </div>

    <!-- مشغل واحد ثابت -->
    <audio id="ayah-player" style="width:100%;margin:10px 0;"></audio>

  </div>

  <div class="tafseer-content" id="tafseer-content">
    <div class="tafseer-toolbar">
      <div class="tafaseer">
        <input type="radio" name="tafseer" id="tafseer1" onclick="updateTafsir()" checked />
        <label for="tafseer1">التفسير الميسر</label>
        <input type="radio" name="tafseer" id="tafseer2" onclick="updateTafsir()" />
        <label for="tafseer2">تفسير ابن كثير</label>
        <input type="radio" name="tafseer" id="tafseer3" onclick="updateTafsir()" />
        <label for="tafseer3">تفسير السعدي</label>
        <input type="radio" name="tafseer" id="tafseer4" onclick="updateTafsir()" />
        <label for="tafseer4">تفسير الطبري</label>
      </div>
      <div class="fontsized">
        <div class="slider-container"> <input type="range" id="fontSizeSlider" min="20" max="32" value="20" step="1">
          <div class="size-value" id="sizeValue">20px</div>
        </div>
        <div class="size-presets"> <button class="size-btn" data-size="20">صغير</button> <button
            class="size-btn active" data-size="24">متوسط</button> <button class="size-btn" data-size="28">كبير</button>
          <button class="size-btn" data-size="32">كبير جداً</button> </div>
      </div>
    </div>
    <div class="close_btn" onclick="closeTafsir()">&times;</div>
    <div class="details"></div>
  </div>



  <div class="info-overlay" id="infoOverlay">
    <div class="info" id="infoBox">
      <div class="close-btn" onclick="closeInfoPopup()">&times;</div>
      <h2 class="name"></h2>
      <h2 class="ayahcount"></h2>
      <h2 class="revelation"></h2>
    </div>
  </div>

  <div class="recite-overlay hidden" id="reciteOverlay">
    <div class="recite-modal">
      <div class="recite-header">
        <h3>التسميع بالذكاء الاصطناعي</h3>
        <button class="recite-close" onclick="closeRecite()">×</button>
      </div>
      <div class="recite-ayah" id="reciteAyahText">...</div>
      <div class="recite-actions">
        <button class="recite-btn primary" id="reciteStartBtn" onclick="startRecite()">ابدأ التسميع</button>
        <button class="recite-btn" id="reciteStopBtn" onclick="stopRecite()" disabled>إيقاف</button>
      </div>
      <div class="recite-status" id="reciteStatus">جاهز للتسجيل</div>
      <div class="recite-result" id="reciteResult"></div>
    </div>
  </div>


  <script src="../components/header.js"></script>
  <script src="../assets/js/toast_notification.js"></script>

  <script>

    document.addEventListener("DOMContentLoaded", async function () {
      window.addEventListener("load", () => {
        const loadingContainer = document.querySelector(".loading_container");
        if (loadingContainer) {
          loadingContainer.classList.add("fade-out");
          setTimeout(() => {
            loadingContainer.style.display = "none";
          }, 2000);
        }
      });
      // دالة الانتظار
      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      // ننتظر 2 ثانية قبل البدء
      await sleep(200);

      const today = new Date();
      const day = String(today.getDate()).padStart(2, "0");
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const year = today.getFullYear();
      const hijriDate = `${day}-${month}-${year}`;

      fetch(`https://api.aladhan.com/v1/gToH/${hijriDate}`)
        .then((response) => response.json())
        .then((data) => {
          const hijri = data.data.hijri;
          const display = ` ${hijri.weekday.ar} ${hijri.day} ${hijri.month.ar} ${hijri.year}`;
          const hijiryDiv = document.getElementById("hijiry");
          if (hijiryDiv) hijiryDiv.innerHTML = display;
        })
        .catch((error) => {
          console.error("Fetch Error:", error);
        });

      const params = new URLSearchParams(window.location.search);
      const surahNumber = params.get("number");

      const surahNameElement = document.getElementById("surah-name");
      const ayahsDiv = document.getElementById("surah-ayahs");
      const storage = localStorage;



      if (!surahNumber) {
        surahNameElement.textContent = "لم يتم اختيار سورة.";
      } else {
        document.getElementById("nextsurah").href = `surah.html?number=${Number(surahNumber) + 1}`
        document.getElementById("prevsurah").href = `surah.html?number=${Number(surahNumber) - 1}`
        surahNameElement.textContent = "جاري التحميل...";
        ayahsDiv.textContent = "جاري تحميل الآيات...";

        var reciter = localStorage.getItem("reciter")
        if (!reciter) {
          reciter = "ar.alafasy";
          localStorage.setItem("reciter", reciter);
        }

        await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${reciter}`)

          .then((response) => {
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            surahNameElement.textContent = `${data.data.name}`;
            document.querySelector(".name").textContent = `${data.data.name}`;
            document.querySelector(".ayahcount").textContent = `عدد الآيات: ${data.data.numberOfAyahs}`;
            if (data.data.revelationType == "Meccan") {
              document.querySelector(".revelation").textContent = `مكان النزول: مكة المكرمة`;
            } else {
              document.querySelector(".revelation").textContent = `مكان النزول: المدينة المنورة`;
            }
            surahNameElement.innerHTML = `
              <span class="surah-name-text">${data.data.name}</span>
              <button class="surah-info-btn" onclick="showInfoPopup()" aria-label="معلومات السورة">

    document.addEventListener('DOMContentLoaded', function () {

    let currentAyah = null;
    let currentSurah = null;
    let nextAyahWarmupAudio = null;

    function resetAyahPlayUi() {
      document.querySelectorAll("#surah-ayahs .ayah-inline").forEach((el) => {
        el.style.color = "";
      });
      document.querySelectorAll("#surah-ayahs .control-btn[class*='play-']").forEach((btn) => {
        btn.innerHTML = "<i class='fa-solid fa-play'></i>";
      });
    }

    function getAyahControl(ayahNumber) {
      return document.querySelector(`.audio-${ayahNumber}`);
    }

    function getAyahAudioSrc(ayahNumber) {
      const controlDiv = getAyahControl(ayahNumber);
      if (!controlDiv) return "";
      return controlDiv.getAttribute("data-audio") || "";
    }

    function warmupNextAyahAudio(nextAyahNumber) {
      const nextSrc = getAyahAudioSrc(nextAyahNumber);
      if (!nextSrc) return;

      if (nextAyahWarmupAudio && nextAyahWarmupAudio.src === nextSrc) return;

      nextAyahWarmupAudio = new Audio();
      nextAyahWarmupAudio.preload = "auto";
      nextAyahWarmupAudio.src = nextSrc;
      nextAyahWarmupAudio.load();
    }

    async function playAyah(ayahNumber, options = {}) {
      const { autoAdvance = false } = options;
      const parsedAyah = Number(ayahNumber);
      if (!Number.isFinite(parsedAyah)) return;

      const audioEl = document.getElementById("ayah-player");
      const controlDiv = getAyahControl(parsedAyah);
      if (!controlDiv) {
        console.warn("Audio not found for ayah:", parsedAyah);
        return;
      }

      const ayahEl = controlDiv.parentElement;
      const audioSrc = getAyahAudioSrc(parsedAyah);
      if (!audioSrc) {
        console.error("❌ مفيش لينك صوت للآية:", parsedAyah);
        return;
      }

      audioEl.preload = "auto";

      const isSameAyah = currentAyah === parsedAyah;
      if (!autoAdvance && isSameAyah && !audioEl.paused) {
        audioEl.pause();
        audioEl.currentTime = 0;
        currentAyah = null;
        resetAyahPlayUi();
        return;
      }

      if (!audioEl.paused) {
        audioEl.pause();
      }

      resetAyahPlayUi();
      currentAyah = parsedAyah;
      window.location.hash = ayahEl.id;

      if (audioEl.src !== audioSrc) {
        audioEl.src = audioSrc;
      }
      audioEl.currentTime = 0;

      ayahEl.style.color = "var(--color-primary)";
      const playBtn = document.querySelector(`.play-${parsedAyah}`);
      if (playBtn) playBtn.innerHTML = "<i class='fa-solid fa-stop'></i>";

      const nextEl = ayahEl.nextElementSibling;
      const nextAyah = nextEl ? Number(nextEl.id) : NaN;
      if (Number.isFinite(nextAyah)) {
        warmupNextAyahAudio(nextAyah);
      }

      try {
        await audioEl.play();
      } catch (error) {
        resetAyahPlayUi();
        currentAyah = null;
        return;
      }

      audioEl.onended = async () => {
        ayahEl.style.color = "";
        if (playBtn) playBtn.innerHTML = "<i class='fa-solid fa-play'></i>";

        if (Number.isFinite(nextAyah)) {
          await playAyah(nextAyah, { autoAdvance: true });
        } else {
          currentAyah = null;
          resetAyahPlayUi();
        }
      };
    }

        autoScrollInterval = null;
      }
    }

  <script>
  let ayahsCache = [];

  // نجمع كل الآيات بعد التحميل
  function cacheAyahs() {
    ayahsCache = [];
    document.querySelectorAll("#surah-ayahs span.ayah-inline").forEach(p => {
      const ayahNumber = p.id;
      const ayahText = p.dataset.ayahText || "";
      ayahsCache.push({
        number: ayahNumber,
        text: ayahText
      });
    });
  }

  function searchAyah() {
    const input = document.getElementById("ayahSearch");
    const query = input.value.trim();
    const resultsDiv = document.getElementById("searchResults");
    const clearBtn = document.getElementById("clearSearch");

    resultsDiv.innerHTML = "";

    if (!query) {
      resultsDiv.style.display = "none";
      clearBtn.style.display = "none";
      return;
    }

    clearBtn.style.display = "inline-block";
    resultsDiv.style.display = "block";

    const normalizedQuery = normalizeArabic(query);

    const matches = ayahsCache.filter(a =>
      normalizeArabic(a.text).includes(normalizedQuery)
    );

    if (matches.length === 0) {
      resultsDiv.innerHTML = `<div>لا توجد نتائج</div>`;
      return;
    }

    matches.forEach(a => {
      const div = document.createElement("div");
      div.innerHTML = highlightMatch(a.text, query) + ` <strong>(${a.number})</strong>`;
      div.onclick = () => goToAyah(a.number);
      resultsDiv.appendChild(div);
    });
  }

  function goToAyah(number) {
    clearHighlights();
    const el = document.getElementById(number);
    if (!el) return;

    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("highlight");

    document.getElementById("searchResults").style.display = "none";
  }

  function clearSearch() {
    document.getElementById("ayahSearch").value = "";
    document.getElementById("searchResults").style.display = "none";
    document.getElementById("clearSearch").style.display = "none";
    clearHighlights();
  }

  function clearHighlights() {
    document.querySelectorAll(".highlight").forEach(el => {
      el.classList.remove("highlight");
    });
  }

  // إزالة التشكيل + توحيد الحروف
  function normalizeArabic(text) {
    return text
      .replace(/[\u064B-\u065F]/g, "") // التشكيل
      .replace(/[إأآا]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ؤ/g, "و")
      .replace(/ئ/g, "ي")
      .replace(/ة/g, "ه")
      .toLowerCase();
  }

  function highlightMatch(text, query) {
    const regex = new RegExp(`(${query})`, "gi");
    return text.replace(regex, `<span class="highlight">$1</span>`);
  }

  // بعد تحميل السورة
  document.addEventListener("DOMContentLoaded", () => {
    const observer = new MutationObserver(() => {
      if (document.querySelectorAll("#surah-ayahs span.ayah-inline").length > 0) {
        cacheAyahs();
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById("surah-ayahs"), { childList: true });
  });
</script>

  <script>
    let currentReciteAyah = null;
    let recognition = null;
    let reciteActive = false;
    let reciteTranscript = "";

    function openRecite(ayahNumber, ayahText) {
      currentReciteAyah = { number: ayahNumber, text: ayahText };
      document.getElementById("reciteAyahText").textContent = ayahText;
      document.getElementById("reciteResult").textContent = "";
      document.getElementById("reciteStatus").textContent = "جاهز للتسجيل";
      document.getElementById("reciteOverlay").classList.remove("hidden");
    }

    function closeRecite() {
      document.getElementById("reciteOverlay").classList.add("hidden");
      if (recognition) recognition.stop();
    }

    function normalizeReciteArabic(text) {
      return text
        .replace(/[\u064B-\u065F]/g, "")
        .replace(/\u0670/g, "")
        .replace(/[إأآاٱ]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي")
        .replace(/ة/g, "ه")
        .trim();
    }

    function diffReciteWords(refText, hypText) {
      const ref = normalizeReciteArabic(refText).split(/\s+/).filter(Boolean);
      const hyp = normalizeReciteArabic(hypText).split(/\s+/).filter(Boolean);
      const missing = ref.filter(w => !hyp.includes(w));
      const extra = hyp.filter(w => !ref.includes(w));
      const matched = hyp.filter(w => ref.includes(w));
      const score = ref.length ? Math.max(0, Math.min(100, Math.round((matched.length / ref.length) * 100))) : 0;
      return { missing, extra, matched, score };
    }

    function renderReciteResult(transcript) {
      const result = document.getElementById("reciteResult");
      const diff = diffReciteWords(currentReciteAyah.text, transcript);
      result.innerHTML = `
        <div><strong>النص المستخرج:</strong> ${transcript || "—"}</div>
        <div><strong>الدقة:</strong> ${diff.score}%</div>
        <div><strong>نواقص:</strong> ${diff.missing.join("، ") || "—"}</div>
        <div><strong>زيادات:</strong> ${diff.extra.join("، ") || "—"}</div>
        <div class="ai-meta">تنبيه: هذه مقارنة نصية تقريبية، وليست ضبط تجويد كامل.</div>
      `;
    }

    function startRecite() {
      const status = document.getElementById("reciteStatus");
      const startBtn = document.getElementById("reciteStartBtn");
      const stopBtn = document.getElementById("reciteStopBtn");
      status.textContent = "يتم الاستماع...";

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        status.textContent = "هذه الميزة غير مدعومة في هذا المتصفح.";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.interimResults = true;
      recognition.continuous = true;
      recognition._lastTranscript = "";
      reciteTranscript = "";

      recognition.onresult = (event) => {
        let finalText = "";
        let interimText = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript || "";
          if (event.results[i].isFinal) finalText += text + " ";
          else interimText += text + " ";
        }
        if (finalText.trim()) {
          reciteTranscript += finalText;
          recognition._lastTranscript = reciteTranscript;
          renderReciteResult(reciteTranscript);
          status.textContent = "يتم الاستماع...";
        } else if (interimText.trim()) {
          status.textContent = "يتم الاستماع...";
        }
      };

      recognition.onerror = () => {
        status.textContent = "حدث خطأ أثناء الاستماع.";
        reciteActive = false;
      };

      recognition.onend = () => {
        if (reciteActive) {
          recognition.start();
          return;
        }
        if (!recognition._lastTranscript) {
          renderReciteResult("");
          status.textContent = "لم يتم التقاط صوت. حاول مرة أخرى.";
        } else {
          status.textContent = "تم الإيقاف";
          renderReciteResult(reciteTranscript);
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };

      reciteActive = true;
      recognition.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    }

    function stopRecite() {
      const startBtn = document.getElementById("reciteStartBtn");
      const stopBtn = document.getElementById("reciteStopBtn");
      reciteActive = false;
      if (recognition) recognition.stop();
      const status = document.getElementById("reciteStatus");
      status.textContent = "جاري الإيقاف...";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    window.openRecite = openRecite;
    window.closeRecite = closeRecite;
    window.startRecite = startRecite;
    window.stopRecite = stopRecite;
  </script>
